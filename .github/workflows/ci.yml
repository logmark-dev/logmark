name: CI

# Continuous build/test for the logmark repo. Same green bar as OSS launch
# Task 4 (public solution builds and tests standalone with no private-repo
# access), now enforced on every push and PR.

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  dotnet:
    name: dotnet build+test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json

      - name: dotnet build
        run: dotnet build logmark.sln --configuration Release

      - name: dotnet test
        run: dotnet test logmark.sln --configuration Release --no-build

  node:
    name: node build+test (TS smoke)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'

      - name: packages/lblocks - install
        working-directory: packages/lblocks
        run: npm ci --no-audit --no-fund

      - name: packages/lblocks - build (tsc)
        working-directory: packages/lblocks
        run: npm run build

      - name: packages/lblocks - test (vitest)
        working-directory: packages/lblocks
        run: npm test

      - name: cockpit - build (vite build)
        # Exercises the same path as build/dist.mjs's cockpit() step: the
        # TS smoke for the cockpit SPA that embeds into the logmark binary.
        run: node build/dist.mjs cockpit --force
