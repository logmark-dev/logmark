name: Release

# Tag push -> 3-platform self-contained logmark builds -> one GitHub Release
# carrying the three archives + a single LF-only SHA256SUMS. Version comes
# from the VERSION file at the repo root (an independent sequence from the
# desktop app's 0.x or the web platform's v1.2.x - design 5.2); the pushed tag
# must equal v<VERSION> or the build fails. A suffixed version is a prerelease.
#
# Per-RID build logic lives in build/dist.mjs (the same script
# scripts/oss/cut.mjs calls locally) so CI and the local pipeline never
# drift apart.

permissions:
  contents: read

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: build (${{ matrix.rid }})
    runs-on: ${{ matrix.runner }}
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            runner: ubuntu-latest
          - rid: osx-arm64
            runner: macos-14
          - rid: win-x64
            runner: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'

      - name: Version from VERSION file, must match the tag
        id: version
        shell: bash
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          tag="${GITHUB_REF_NAME}"
          if [ "$tag" != "v$version" ]; then
            echo "tag $tag does not match VERSION $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          case "$version" in *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT";; *) echo "prerelease=false" >> "$GITHUB_OUTPUT";; esac

      - name: Build + archive (${{ matrix.rid }})
        shell: bash
        run: node build/dist.mjs build --rid ${{ matrix.rid }} --version ${{ steps.version.outputs.version }} --out dist-out

      - name: Upload archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: logmark-${{ matrix.rid }}
          path: |
            dist-out/*.zip
            dist-out/*.tar.gz
          if-no-files-found: error

  gather:
    name: gather + release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        # For build/dist.mjs's `sums` subcommand only - no build artifacts
        # from the checkout itself are used in this job.
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'

      - name: Download all archives
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: gathered
          merge-multiple: true

      - name: Compute SHA256SUMS
        run: node build/dist.mjs sums --dir gathered

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            gathered/*.zip
            gathered/*.tar.gz
            gathered/SHA256SUMS
          name: LogMark Engine ${{ github.ref_name }}
          fail_on_unmatched_files: true
          generate_release_notes: true
          prerelease: ${{ needs.build.outputs.prerelease == 'true' }}
